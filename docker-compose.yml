version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: learning-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: learning_db
      MYSQL_USER: learning_user
      MYSQL_PASSWORD: learning_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
