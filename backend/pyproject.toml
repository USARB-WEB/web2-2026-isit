[project]
name = "learning-backend"
version = "0.1.0"
description = "Learning-oriented FastAPI backend starter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
